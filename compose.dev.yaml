# Nexus for working on its code, in Docker: the service under dotnet run, the pages under Vite's dev server, MySQL,
# and Mailpit, at the ports development uses, with Caddy serving the pages, the service, and the sign-in callback over
# HTTPS, as the release containers do. Each container copies in the code as saved every time it starts, so restarting
# it runs the latest code. "Nexus Dev.cmd" on Windows, or nexus-dev.sh on macOS and Linux, builds and starts it; run it
# again after changing a project or package file or this file. These containers share nothing with compose.yaml's.
# compose.dev.both.yaml runs them beside Scry's. By hand, every command takes
# --env-file .env.dev, where the launcher keeps the database's password.
name: pluperfect-data-dev
services:
  nexus-db-dev:
    image: mysql:8.4
    container_name: nexus-db-dev
    environment:
      MYSQL_DATABASE: nexus
      MYSQL_USER: nexus
      MYSQL_PASSWORD: ${NEXUS_DEV_DB_PASSWORD:?The dev launcher sets NEXUS_DEV_DB_PASSWORD in .env.dev; run it first}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      # For MySQL Workbench or the mysql client: user nexus, with the password in .env.dev.
      - "127.0.0.1:6167:3306"
    volumes:
      - nexus-database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      # MySQL's first start makes its database files, which can take several minutes.
      start_period: 10m

  nexus-mail-dev:
    image: axllent/mailpit:v1.33
    container_name: nexus-mail-dev
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:6168:8025"
    volumes:
      - nexus-mail:/data

  nexus-api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: api
      additional_contexts:
        jwt: ../../Pluperfect.Jwt
        mail: ../../Pluperfect.Mail
    container_name: nexus-api-dev
    depends_on:
      nexus-db-dev:
        condition: service_healthy
      nexus-mail-dev:
        condition: service_started
    environment:
      ConnectionStrings__Nexus: Server=nexus-db-dev;Port=3306;Database=nexus;User ID=nexus;Password=${NEXUS_DEV_DB_PASSWORD}
      Nexus__ClientOrigin: https://localhost:6165
      Nexus__CallbackOrigin: https://127.0.0.1:6164
      # Browsers reach the service only through nexus-caddy-dev, so its forwarding headers say who asked and over what.
      Nexus__Proxied: "true"
      Mail__MailpitUrl: http://nexus-mail-dev:8025
      Nexus__MailpitInbox: http://localhost:6168
    healthcheck:
      # A connection alone, since the service logs every request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6163"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      # The first start builds the service and makes the database's tables, which can take several minutes.
      start_period: 10m
    # Copies in the code as saved, keeping the container's own bin and obj and leaving out the data that running from
    # the code keeps, then runs it once, so every start or restart runs the latest code.
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        shopt -s dotglob nullglob
        for from in /source/Pluperfect.Data/Nexus/Server/src/* /source/Pluperfect.Jwt/src/Pluperfect.Jwt \
            /source/Pluperfect.Mail/src/Pluperfect.Mail; do
          to="/src$${from#/source}"
          mkdir -p "$$to"
          for entry in "$$to"/*; do case "$${entry##*/}" in bin|obj) ;; *) rm -rf "$$entry" ;; esac; done
          for entry in "$$from"/*; do case "$${entry##*/}" in bin|obj|data|Data) ;; *) cp -a "$$entry" "$$to/" ;; esac; done
        done
        cd /src/Pluperfect.Data/Nexus/Server/src/Nexus.Service
        exec dotnet run --no-launch-profile --disable-build-servers
    volumes:
      - nexus-data:/data
      # Read only, by the command above.
      - ./Server/src:/source/Pluperfect.Data/Nexus/Server/src:ro
      - ../../Pluperfect.Jwt/src/Pluperfect.Jwt:/source/Pluperfect.Jwt/src/Pluperfect.Jwt:ro
      - ../../Pluperfect.Mail/src/Pluperfect.Mail:/source/Pluperfect.Mail/src/Pluperfect.Mail:ro

  nexus-caddy-dev:
    image: caddy:2-alpine
    container_name: nexus-caddy-dev
    depends_on:
      nexus-api-dev:
        condition: service_healthy
      nexus-web-dev:
        condition: service_healthy
    ports:
      - "127.0.0.1:6163:6163"
      - "127.0.0.1:6164:6164"
      - "127.0.0.1:6165:6165"
    volumes:
      - ./deploy/docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - nexus-caddy:/data
    healthcheck:
      # Healthy once Caddy has made the authority its certificates come from, which the launcher asks this computer
      # to trust.
      test: ["CMD", "test", "-f", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      start_period: 1m
      retries: 3

  nexus-web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: web
      additional_contexts:
        jwt: ../../Pluperfect.Jwt
        mail: ../../Pluperfect.Mail
    container_name: nexus-web-dev
    environment:
      # Ahead of Client/.env.development, which names the service as it runs from the code.
      VITE_API_URL: https://localhost:6163
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6165/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 2m
    # Copies in the code as saved, then serves it, so every start or restart runs the latest code; node_modules stays
    # the image's own.
    command:
      - sh
      - -c
      - >-
        for p in src public index.html vite.config.ts .env.development; do rm -rf "$$p" && cp -a "/source/Client/$$p" "$$p" || exit 1; done
        && exec npm run dev -- --host 0.0.0.0
    volumes:
      # Read only, by the command above.
      - ./Client:/source/Client:ro

volumes:
  nexus-database:
    name: nexus-dev-database
  nexus-data:
    name: nexus-dev-data
  nexus-mail:
    name: nexus-dev-mail
  nexus-caddy:
    name: nexus-dev-caddy
