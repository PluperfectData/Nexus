# Nexus for working on its code, in Docker: the service under dotnet watch, the pages under Vite's dev server, MySQL,
# and Mailpit, at the addresses development uses. "Nexus Dev.cmd" on Windows, or nexus-dev.sh on macOS and Linux,
# starts it and watches the folders: each saved file is copied into its container, which reloads. These containers
# share nothing with compose.yaml's. compose.dev.both.yaml runs them beside Scry's. By hand, every command takes
# --env-file .env.dev, where the launcher keeps the database's password.
name: pluperfect-data-dev
services:
  nexus-db-dev:
    image: mysql:8.4
    container_name: nexus-db-dev
    environment:
      MYSQL_DATABASE: nexus
      MYSQL_USER: nexus
      MYSQL_PASSWORD: ${NEXUS_DEV_DB_PASSWORD:?The dev launcher sets NEXUS_DEV_DB_PASSWORD in .env.dev; run it first}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      # For MySQL Workbench or the mysql client: user nexus, with the password in .env.dev.
      - "127.0.0.1:6167:3306"
    volumes:
      - nexus-database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      # MySQL's first start makes its database files, which can take several minutes.
      start_period: 10m

  nexus-mail-dev:
    image: axllent/mailpit:v1.33
    container_name: nexus-mail-dev
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:6168:8025"
    volumes:
      - nexus-mail:/data

  nexus-api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: api
      additional_contexts:
        jwt: ../../Pluperfect.Jwt
        mail: ../../Pluperfect.Mail
    container_name: nexus-api-dev
    depends_on:
      nexus-db-dev:
        condition: service_healthy
      nexus-mail-dev:
        condition: service_started
    environment:
      ConnectionStrings__Nexus: Server=nexus-db-dev;Port=3306;Database=nexus;User ID=nexus;Password=${NEXUS_DEV_DB_PASSWORD}
      Nexus__ClientOrigin: http://localhost:6165
      Nexus__CallbackOrigin: https://127.0.0.1:6164
      # The callback address reaches the service through nexus-callback-dev, whose forwarding headers say over what.
      Nexus__Proxied: "true"
      Mail__MailpitUrl: http://nexus-mail-dev:8025
      Nexus__MailpitInbox: http://localhost:6168
    ports:
      - "127.0.0.1:6163:6163"
    volumes:
      - nexus-data:/data
    develop:
      # Compose copies a folder whose entries changed whole, ignored files included, and a save through a temp file
      # changes the folder it lands in. A watch root's own changes aren't reported, so each project is a root.
      watch:
        - action: sync
          path: Server/src/Nexus.Service
          target: /src/Pluperfect.Data/Nexus/Server/src/Nexus.Service
          # Matched with case, and Windows keeps a folder's first spelling.
          ignore: [bin/, obj/, data/, Data/]
        - action: sync
          path: Server/src/Nexus.Abstractions
          target: /src/Pluperfect.Data/Nexus/Server/src/Nexus.Abstractions
          ignore: &build [bin/, obj/]
        - action: sync
          path: Server/src/Nexus.Csv
          target: /src/Pluperfect.Data/Nexus/Server/src/Nexus.Csv
          ignore: *build
        - action: sync
          path: Server/src/Nexus.DuckDb
          target: /src/Pluperfect.Data/Nexus/Server/src/Nexus.DuckDb
          ignore: *build
        - action: sync
          path: Server/src/Nexus.MySql
          target: /src/Pluperfect.Data/Nexus/Server/src/Nexus.MySql
          ignore: *build
        - action: sync
          path: Server/src/Nexus.Postgres
          target: /src/Pluperfect.Data/Nexus/Server/src/Nexus.Postgres
          ignore: *build
        - action: sync
          path: Server/src/Nexus.Push
          target: /src/Pluperfect.Data/Nexus/Server/src/Nexus.Push
          ignore: *build
        - action: sync
          path: Server/src/Nexus.Schwab
          target: /src/Pluperfect.Data/Nexus/Server/src/Nexus.Schwab
          ignore: *build
        - action: sync
          path: Server/src/Nexus.Sql
          target: /src/Pluperfect.Data/Nexus/Server/src/Nexus.Sql
          ignore: *build
        - action: sync
          path: Server/src/Nexus.SqlServer
          target: /src/Pluperfect.Data/Nexus/Server/src/Nexus.SqlServer
          ignore: *build
        - action: sync
          path: ../../Pluperfect.Jwt/src/Pluperfect.Jwt
          target: /src/Pluperfect.Jwt/src/Pluperfect.Jwt
          ignore: *build
        - action: sync
          path: ../../Pluperfect.Mail/src/Pluperfect.Mail
          target: /src/Pluperfect.Mail/src/Pluperfect.Mail
          ignore: *build
        - action: rebuild
          path: Server/Directory.Packages.props

  nexus-callback-dev:
    image: caddy:2-alpine
    container_name: nexus-callback-dev
    depends_on:
      - nexus-api-dev
    ports:
      - "127.0.0.1:6164:6164"
    volumes:
      - ./deploy/docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - nexus-caddy:/data
    healthcheck:
      # Healthy once Caddy has made the authority its certificate comes from, which the launcher asks this computer
      # to trust.
      test: ["CMD", "test", "-f", "/data/caddy/pki/authorities/local/root.crt"]
      interval: 2s
      timeout: 5s
      start_period: 1m

  nexus-web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: web
      additional_contexts:
        jwt: ../../Pluperfect.Jwt
        mail: ../../Pluperfect.Mail
    container_name: nexus-web-dev
    ports:
      - "127.0.0.1:6165:6165"
    develop:
      watch:
        - action: sync
          path: Client/src
          target: /src/Pluperfect.Data/Nexus/Client/src
        - action: sync
          path: Client/public
          target: /src/Pluperfect.Data/Nexus/Client/public
        - action: sync
          path: Client/index.html
          target: /src/Pluperfect.Data/Nexus/Client/index.html
        - action: sync
          path: Client/vite.config.ts
          target: /src/Pluperfect.Data/Nexus/Client/vite.config.ts
        - action: sync
          path: Client/.env.development
          target: /src/Pluperfect.Data/Nexus/Client/.env.development
        - action: rebuild
          path: Client/package.json
        - action: rebuild
          path: Client/package-lock.json
        - action: rebuild
          path: ../../Pluperfect.Jwt/client/src

volumes:
  nexus-database:
    name: nexus-dev-database
  nexus-data:
    name: nexus-dev-data
  nexus-mail:
    name: nexus-dev-mail
  nexus-caddy:
    name: nexus-dev-caddy
